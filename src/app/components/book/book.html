<div class="container">
    <h3>Cadastro</h3>

    <form action="">
        <div class="row">
            <div class="mb-3 col-lg-6">
                <label for="title" class="form-label">Título:</label>
                <input type="text" class="form-control" [(ngModel)]="book.title" id="title" name="title" required>
            </div>
            <div class="mb-3 col-lg-6">
                <label for="author" class="form-label">Autor:</label>
                <input type="text" class="form-control" [(ngModel)]="book.author" id="author" name="author" required>
            </div>
        </div>
        <div class="row">
            <div class="mb-3 col-lg-3">
                <label for="price" class="form-label">Preço:</label>
                <input type="number" class="form-control" [(ngModel)]="book.price" id="price" name="price" required>
            </div>
        </div>
        <div class="row">
            <div>
                <button class="btn btn-primary">Salvar</button>
            </div>
        </div>
    </form>
</div>
